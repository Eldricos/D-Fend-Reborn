; Game information values of D-Fend Reborn (auto setup templates, profiles,
; game information lookup).
;
; [Genres], [Languages] and [Licenses] are the standard English values of the
; fields Genre, Language and License (the language files translate them, see
; GameSetup/Genre.EnglishNames). Several values are separated by ";".
; The *Aliases sections map other spellings to a standard value (keys are
; compared case insensitively); [WikidataGenres] maps the English genre labels
; of Wikidata to standard genres ("" = ignore).
;
; Used by D-Fend Reborn and by tools/autosetup.py (template checker); see
; docs/AutoSetupTemplates.md.

