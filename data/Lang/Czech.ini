MainInfo=Informace o struktuøe souborù v D-Fend Reborn
MainInfoPart1=D-Fend Reborn je 100% Vista kompatibilní. Znamená to, e respektuje oddìlení souborù s programy od dat uivatele. Pokud jste D-Fend Reborn nainstalovali v reimu "uivatelského profilu", pak budou soubory programu umístìny v adresáøi ("C:\Program files\D-Fend Reborn" je vıchozím) a uivatelská data budou umístìna v podadresáøi adresáøe vašeho profilu ("C:\Users\<váš_profil>\D-Fend Reborn" jako vıchozí). Jakmile je D-Fend Reborn nainstalován, ji do adresáøe programu více nezapisuje. Veškerá nastavení a data jsou ukládána do podadresáøe vašeho uivatelského profilu.
MainInfoPart2=DOSBox a Windows nepouívají stejnou adresáøovou strukturu. Programy uvnitø DOSBoxu mají pøístup pouze na vyhrazenou èást z celé adresáøové struktury Windows, take hry bìící pod DOSBoxem nemohou poškodit vaše systémové soubory (pokud DOSBoxu nenastavíte svùj skuteènı disk "C:\" jako disk C: v DOSBoxu). V naprosté vìtšinì pøípadù je tøeba pøipojit adresáø typu "C:\OldGames" jako disk C: v DOSBoxu. To znamená, e pokud máte hru uloenu v "C:\OldGames\Hra_X", budete k této høe mít v DOSBoxu pøístup na "C:\Hra_X". S D-Fend Reborn si však nemusíte s pøipojováním adresáøù dìlat starosti, protoe bude správné adresáøe pøipojovat automaticky.
MainInfoPart3=Své hry mùete umístit kamkoli, ale doporuèujeme pouívat pøedefinovanı adresáø pro hry ("C:\Users\<váš_profil>\D-Fend Reborn\VirtualHD"). Pokud pouijete pro své hry tento adresáø, mùe D-Fend Reborn pouívat v profilu relativní cesty (".\VirtualHD\NewGame" namísto "C:\Users\<váš_profil>\D-Fend Reborn\VirtualHD\NewGame"). Kdy D-Fend Reborn ví, e soubory se hrou jsou umístìny relativnì vùèi adresáøi s daty programu, mùe soubory se hrou pøenést na jinou instalaci anebo vytvoøit instalaèní balíèek. S absolutními cestami toto není moné.
