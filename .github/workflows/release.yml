# Release: builds the downloads of a new version and attaches them to its
# GitHub release. Two ways to start it:
#  - publish a release on GitHub (Releases > Draft a new release) with a new
#    tag named like the version ("v0.5.0" or "0.5.0"): the files are added
#    to that release when they are built (about 20 minutes),
#  - or push such a tag with git: a draft release is created with the files.
#
#   Windows: D-Fend-Reborn-<version>-Setup.exe        (full installer)
#            D-Fend-Reborn-<version>-UpdateSetup.exe  (update installer)
#            D-Fend-Reborn-<version>-Windows-Portable.zip
#            D-Fend-Reborn-<version>-Portable.paf.exe  (PortableApps.com package)
#   Linux:   D-Fend-Reborn-<version>-x86_64.AppImage  (runs without installing Qt; X11 and Wayland)
#            D-Fend-Reborn-<version>-Linux-x86_64.tar.gz (needs Qt 6.4+ of the distribution)
#
# A draft release created by the workflow has to be published on the releases
# page ("Publish release"); the update check of the program only sees
# published releases that are not marked as pre-release.
# See Install/README_HOW_TO_BUILD.txt, "Releases".
name: Release

on:
  push:
    tags: ['v[0-9]*', '[0-9]*']
  release:
    types: [published]
  # test build (Actions > Release > Run workflow): builds and tests all
  # downloads of the version in CMakeLists.txt (as workflow artifacts),
  # without a release
  workflow_dispatch:

# creating a release on GitHub can also push its tag: run once per tag
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  version:
    name: Check version numbers
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Compare tag, CMakeLists.txt and VersionSettings.nsi
        id: check
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            TAG=$(sed -n 's/^project(DFendReborn VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          fi
          if ! echo "$TAG" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::The tag \"$GITHUB_REF_NAME\" is not a version number. Use a tag like v0.5.0 (the version of CMakeLists.txt)."
            exit 1
          fi
          CMAKE=$(sed -n 's/^project(DFendReborn VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          NSIS=$(tr -d '\r' < Install/VersionSettings.nsi | awk '/!define VER_MAYOR/{a=$3} /!define VER_MINOR1/{b=$3} /!define VER_MINOR2/{c=$3} END{print a"."b"."c}')
          echo "Tag: $TAG, CMakeLists.txt: $CMAKE, VersionSettings.nsi: $NSIS"
          if [ "$TAG" != "$CMAKE" ] || [ "$TAG" != "$NSIS" ]; then
            echo "::error::The version numbers at the commit of the tag $GITHUB_REF_NAME ($(git rev-parse --short HEAD)) do not match. Set the version $TAG in CMakeLists.txt (project ... VERSION) and Install/VersionSettings.nsi on main first. If you changed them after creating the tag: a tag stays on the commit it was created for - delete the release and the tag $GITHUB_REF_NAME on GitHub and create them again."
            exit 1
          fi
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

  windows:
    name: Windows installers and portable zip
    needs: version
    runs-on: windows-2022
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          modules: qtmultimedia
          cache: true

      - name: Set up MSVC
        # (vcvars64.bat of Visual Studio; replaces ilammy/msvc-dev-cmd, which
        # still runs on the deprecated Node.js 20)
        shell: pwsh
        run: |
          $VS = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $VS) { Write-Error "Visual Studio with C++ tools not found"; exit 1 }
          cmd /c "`"$VS\VC\Auxiliary\Build\vcvars64.bat`" > nul && set" | ForEach-Object {
            # only the variables vcvars64.bat set or changed; new PATH folders
            # through GITHUB_PATH
            if ($_ -match '^([^=]+)=(.*)$') {
              $Name = $Matches[1]; $Value = $Matches[2]
              if ($Name -eq 'Path') {
                $Old = $env:Path -split ';'
                $Value -split ';' | Where-Object { $_ -and $Old -notcontains $_ } | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
              } elseif ([Environment]::GetEnvironmentVariable($Name) -ne $Value) {
                "$Name=$Value" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
              }
            }
          }

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Program folder
        shell: bash
        run: |
          cmake --install build --prefix Install/Stage
          test -f Install/Stage/DFend.exe
          test -f Install/Stage/Qt6Core.dll
          test -f Install/Stage/Qt/platforms/qwindows.dll
          test -f Install/Stage/DOSBox/dosbox.exe

      - name: Installers
        shell: bash
        run: |
          MAKENSIS="/c/Program Files (x86)/NSIS/makensis.exe"
          if [ ! -f "$MAKENSIS" ]; then choco install nsis -y --no-progress; fi
          cd Install
          "$MAKENSIS" D-Fend-Reborn-Setup.nsi
          "$MAKENSIS" D-Fend-Reborn-UpdateSetup.nsi
          mkdir -p ../dist
          mv "D-Fend-Reborn-$VERSION-Setup.exe" "D-Fend-Reborn-$VERSION-UpdateSetup.exe" ../dist/

      - name: Portable zip
        shell: pwsh
        run: |
          # portable mode: all data in the program folder, relative paths;
          # data folders laid out like the setup does it (no NewUserData)
          Copy-Item -Recurse Install/Stage "D-Fend Reborn"
          bash packaging/portable-layout.sh "D-Fend Reborn"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Set-Content -Path "D-Fend Reborn/DFend.dat" -Value "PORTABLEMODE" -NoNewline
          Compress-Archive -Path "D-Fend Reborn" -DestinationPath "dist/D-Fend-Reborn-$env:VERSION-Windows-Portable.zip"

      - name: PortableApps.com package
        shell: bash
        run: sh packaging/portableapps.sh "D-Fend Reborn" "$VERSION" dist "/c/Program Files (x86)/NSIS/makensis.exe"

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/*
          retention-days: 7

  appimage:
    name: Linux AppImage
    needs: version
    # the oldest supported runner: the AppImage runs on systems with the same
    # or a newer glibc
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ libgl-dev libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libegl1 \
            libwayland-client0 libwayland-cursor0 libwayland-egl1

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: linux_gcc_64
          modules: qtmultimedia
          cache: true

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: AppDir
        run: |
          # program and data files next to each other in usr/bin (the program
          # looks for its files in the folder of the executable)
          cmake --install build --prefix AppDir/usr/bin
          # the AppImage is read-only: user data in ~/.local/share/D-Fend Reborn
          printf 'USERDIRMODE\n' > AppDir/usr/bin/DFend.dat

      - name: AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          ARCH: x86_64
          # X11 (xcb) and Wayland: on a Wayland desktop Qt uses the Wayland
          # plugin, QT_QPA_PLATFORM=xcb selects XWayland
          EXTRA_PLATFORM_PLUGINS: libqwayland-egl.so;libqwayland-generic.so
          EXTRA_QT_MODULES: waylandcompositor
        run: |
          curl -sSLO https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -sSLO https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          curl -sSLO https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x *.AppImage
          export QMAKE="$QT_ROOT_DIR/bin/qmake"
          export LD_LIBRARY_PATH="$QT_ROOT_DIR/lib:$LD_LIBRARY_PATH"
          ./linuxdeploy-x86_64.AppImage --appdir AppDir \
            --executable AppDir/usr/bin/DFend \
            --desktop-file packaging/linux/dfend-reborn.desktop \
            --icon-file packaging/linux/dfend-reborn.png \
            --plugin qt
          for P in platforms/libqxcb.so platforms/libqwayland-generic.so platforms/libqwayland-egl.so \
                   wayland-shell-integration wayland-decoration-client; do
            test -e "AppDir/usr/plugins/$P" || { echo "::error::Qt plugin $P missing in the AppImage"; exit 1; }
          done
          mkdir -p dist
          ./appimagetool-x86_64.AppImage AppDir "dist/D-Fend-Reborn-$VERSION-x86_64.AppImage"

      - name: Test start
        run: |
          # start the AppImage on a virtual X11 display and on a headless
          # Wayland compositor (weston), each time with an empty home folder:
          # it must still run after 20 seconds and have created its data
          # folder. The extracted AppImage is started (AppRun), so that the
          # test can stop the program itself.
          sudo apt-get install -y --no-install-recommends xvfb weston
          "dist/D-Fend-Reborn-$VERSION-x86_64.AppImage" --appimage-extract > /dev/null
          cat > test-start.sh <<'EOF'
          export HOME="$RUNNER_TEMP/home-$1"; mkdir -p "$HOME"
          squashfs-root/AppRun > "start-$1.log" 2>&1 &
          P=$!; sleep 20
          if ! kill -0 $P 2> /dev/null; then
            echo "::error::D-Fend Reborn did not start ($1)"; tail -n 40 "start-$1.log"; exit 1
          fi
          kill $P; wait $P
          tail -n 20 "start-$1.log"
          test -d "$HOME/.local/share/D-Fend Reborn/Settings"
          EOF
          xvfb-run -a sh test-start.sh x11
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg"; mkdir -m 700 -p "$XDG_RUNTIME_DIR"
          weston --backend=headless-backend.so --socket=wayland-test --idle-time=0 > weston.log 2>&1 &
          W=$!; sleep 3
          # QT_QPA_PLATFORM=wayland: no fallback to X11 (there is no X server here)
          env -u DISPLAY WAYLAND_DISPLAY=wayland-test QT_QPA_PLATFORM=wayland sh test-start.sh wayland \
            || { tail -n 20 weston.log; exit 1; }
          kill $W

      - uses: actions/upload-artifact@v7
        with:
          name: appimage
          path: dist/*
          retention-days: 7

  linux:
    name: Linux tar.gz
    needs: version
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Qt and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ \
            qt6-base-dev qt6-multimedia-dev libqt6dbus6 libgl-dev

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Archive
        run: |
          # program folder mode: all data next to the program (extract it to
          # a folder in your home directory)
          cmake --install build --prefix "D-Fend Reborn"
          sh packaging/portable-layout.sh "D-Fend Reborn"
          cp packaging/linux/dfend-reborn.desktop packaging/linux/dfend-reborn.png "D-Fend Reborn/"
          mkdir -p dist
          tar czf "dist/D-Fend-Reborn-$VERSION-Linux-x86_64.tar.gz" "D-Fend Reborn"

      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: dist/*
          retention-days: 7

  release:
    name: Draft release
    needs: [version, windows, appimage, linux]
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Source code of the included DOSBox Staging
        run: |
          # the Windows downloads include DOSBox Staging (GNU GPL): its source
          # code is attached to the release
          DOSBOX=$(sed -n 's/^set(DFR_DOSBOX_STAGING_VERSION \([0-9.]*\)).*/\1/p' cmake/DOSBoxStaging.cmake)
          test -n "$DOSBOX"
          echo "DOSBOX=$DOSBOX" >> "$GITHUB_ENV"
          curl -sSfL -o "dist/dosbox-staging-$DOSBOX-source.tar.gz" \
            "https://github.com/dosbox-staging/dosbox-staging/archive/refs/tags/v$DOSBOX.tar.gz"

      - name: Create or update the draft release
        run: |
          ls -la dist
          cat > notes.md <<EOF
          ## Downloads

          **Windows** (64 bit, Windows 10/11)
          - \`D-Fend-Reborn-$VERSION-Setup.exe\`: installer (new installation)
          - \`D-Fend-Reborn-$VERSION-UpdateSetup.exe\`: update of an existing installation (keeps your data)
          - \`D-Fend-Reborn-$VERSION-Windows-Portable.zip\`: portable version (extract and start \`DFend.exe\`)
          - \`D-Fend-Reborn-$VERSION-Portable.paf.exe\`: [PortableApps.com](https://portableapps.com/) package (install it into the PortableApps.com Platform or any folder)

          **Linux** (x86_64)
          - \`D-Fend-Reborn-$VERSION-x86_64.AppImage\`: make it executable and start it (data in \`~/.local/share/D-Fend Reborn\`)
          - \`D-Fend-Reborn-$VERSION-Linux-x86_64.tar.gz\`: program folder, needs Qt 6.4 or newer from your distribution

          On Linux install DOSBox Staging (or DOSBox) with your package manager; optional: 7-Zip (\`7z\`), \`mkfs.fat\`, \`oggenc\`, \`curl\`, ScummVM, Wine.

          The Windows downloads include [DOSBox Staging](https://www.dosbox-staging.org/) $DOSBOX (GNU GPL); \`dosbox-staging-$DOSBOX-source.tar.gz\` is its source code.
          EOF
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            # release created on GitHub: add the files and the download notes
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
            gh release view "$GITHUB_REF_NAME" --json body --jq .body > body.md
            if ! grep -q '^## Downloads' body.md; then
              { cat body.md; printf '\n\n'; cat notes.md; } > new-body.md
              gh release edit "$GITHUB_REF_NAME" --notes-file new-body.md
            fi
          else
            gh release create "$GITHUB_REF_NAME" dist/* --draft --verify-tag \
              --title "D-Fend Reborn $VERSION" --notes-file notes.md --generate-notes
          fi
