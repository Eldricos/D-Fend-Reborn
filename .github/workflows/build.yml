# Build check: compiles D-Fend Reborn on Linux (GCC, distribution Qt) and on
# Windows (MSVC, official Qt) for every push and pull request.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (GCC, Qt 6.4)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Qt and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ \
            qt6-base-dev qt6-multimedia-dev libqt6dbus6 libgl-dev

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Check data files
        run: |
          test -x build/DFend
          test -f build/Lang/English.ini
          test -f build/Help/English/Index.html
          # the Linux build must not contain the Windows helper programs
          if ls build/Bin/*.exe build/Bin/*.dll 2>/dev/null; then echo "Windows programs in Linux build"; exit 1; fi

  windows:
    name: Windows (MSVC, Qt 6.8)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          modules: qtmultimedia
          cache: true

      - name: Set up MSVC
        # (vcvars64.bat of Visual Studio; replaces ilammy/msvc-dev-cmd, which
        # still runs on the deprecated Node.js 20)
        shell: pwsh
        run: |
          $VS = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $VS) { Write-Error "Visual Studio with C++ tools not found"; exit 1 }
          cmd /c "`"$VS\VC\Auxiliary\Build\vcvars64.bat`" > nul && set" | ForEach-Object {
            # only the variables vcvars64.bat set or changed; new PATH folders
            # through GITHUB_PATH
            if ($_ -match '^([^=]+)=(.*)$') {
              $Name = $Matches[1]; $Value = $Matches[2]
              if ($Name -eq 'Path') {
                $Old = $env:Path -split ';'
                $Value -split ';' | Where-Object { $_ -and $Old -notcontains $_ } | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
              } elseif ([Environment]::GetEnvironmentVariable($Name) -ne $Value) {
                "$Name=$Value" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
              }
            }
          }

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Check data files
        shell: bash
        run: |
          test -f build/DFend.exe
          test -f build/Lang/English.ini
          test -f build/Help/English/Index.html
          test -f build/Bin/7za.exe

      - name: Build the installers
        shell: bash
        run: |
          cmake --install build --prefix Install/Stage
          test -f Install/Stage/DFend.exe
          test -f Install/Stage/Qt6Core.dll
          # Qt plugins in the folder "Qt" (qt.conf)
          test -f Install/Stage/qt.conf
          test -f Install/Stage/Qt/platforms/qwindows.dll
          test ! -d Install/Stage/platforms
          MAKENSIS="/c/Program Files (x86)/NSIS/makensis.exe"
          if [ ! -f "$MAKENSIS" ]; then choco install nsis -y --no-progress; fi
          cd Install
          "$MAKENSIS" D-Fend-Reborn-Setup.nsi
          "$MAKENSIS" D-Fend-Reborn-UpdateSetup.nsi

      - name: Build the PortableApps.com package
        shell: bash
        run: |
          cp -R Install/Stage "D-Fend Reborn"
          sh packaging/portable-layout.sh "D-Fend Reborn"
          printf 'PORTABLEMODE' > "D-Fend Reborn/DFend.dat"
          VERSION=$(sed -n 's/^project(DFendReborn VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          sh packaging/portableapps.sh "D-Fend Reborn" "$VERSION" Install "/c/Program Files (x86)/NSIS/makensis.exe"

      - name: Upload the installers
        uses: actions/upload-artifact@v7
        with:
          name: D-Fend-Reborn-Windows-installers
          path: Install/*.exe
          retention-days: 14
